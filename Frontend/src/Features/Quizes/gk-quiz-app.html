<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>∞ GK Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #f5c518;
    --accent2: #e84393;
    --text: #e8e8f0;
    --muted: #666680;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 60% 40% at 20% 50%, rgba(245,197,24,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 30%, rgba(232,67,147,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    padding: 24px 20px;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }

  .logo {
    font-family: 'Bebas Neue', cursive;
    font-size: 2.2rem;
    letter-spacing: 2px;
    color: var(--accent);
    line-height: 1;
  }

  .logo span { color: var(--accent2); }

  .stats {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.6rem;
    line-height: 1;
    color: var(--accent);
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .streak .stat-value { color: var(--accent2); }

  /* Category badge */
  .category-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(245,197,24,0.1);
    border: 1px solid rgba(245,197,24,0.2);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 5px 12px;
    border-radius: 100px;
    margin-bottom: 14px;
  }

  /* Question card */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .q-number {
    font-family: 'Bebas Neue', cursive;
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .question-text {
    font-size: 1.2rem;
    font-weight: 500;
    line-height: 1.6;
    color: var(--text);
  }

  /* Options */
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  .option {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 0.92rem;
    font-weight: 400;
    color: var(--text);
    text-align: left;
    line-height: 1.4;
    animation: fadeUp 0.4s ease both;
  }

  .option:nth-child(1) { animation-delay: 0.05s; }
  .option:nth-child(2) { animation-delay: 0.1s; }
  .option:nth-child(3) { animation-delay: 0.15s; }
  .option:nth-child(4) { animation-delay: 0.2s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: rgba(245,197,24,0.05);
    transform: translateY(-2px);
  }

  .option-letter {
    font-family: 'Bebas Neue', cursive;
    font-size: 1rem;
    background: var(--border);
    color: var(--muted);
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s ease;
    letter-spacing: 0;
  }

  .option.correct {
    border-color: var(--correct);
    background: rgba(34, 197, 94, 0.08);
  }

  .option.correct .option-letter {
    background: var(--correct);
    color: #fff;
  }

  .option.wrong {
    border-color: var(--wrong);
    background: rgba(239, 68, 68, 0.08);
  }

  .option.wrong .option-letter {
    background: var(--wrong);
    color: #fff;
  }

  .option.disabled { cursor: default; }

  /* Explanation */
  .explanation {
    background: rgba(245,197,24,0.05);
    border: 1px solid rgba(245,197,24,0.15);
    border-radius: 14px;
    padding: 16px 20px;
    font-size: 0.88rem;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
    animation: fadeUp 0.3s ease;
    display: none;
  }

  .explanation.show { display: block; }
  .explanation strong { color: var(--accent); }

  /* Next button */
  .next-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #d4a100);
    color: #0a0a0f;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-family: 'Bebas Neue', cursive;
    font-size: 1.3rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: none;
  }

  .next-btn.show { display: block; }
  .next-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,197,24,0.3); }
  .next-btn:active { transform: translateY(0); }

  /* Loading state */
  .loading {
    text-align: center;
    padding: 60px 0;
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    color: var(--muted);
    font-size: 0.9rem;
  }

  /* Result flash */
  .result-flash {
    position: fixed;
    top: 24px;
    right: 24px;
    padding: 12px 24px;
    border-radius: 12px;
    font-family: 'Bebas Neue', cursive;
    font-size: 1.1rem;
    letter-spacing: 1px;
    z-index: 100;
    animation: flashIn 0.3s ease, flashOut 0.3s ease 1.5s forwards;
  }

  .result-flash.correct-flash {
    background: var(--correct);
    color: #fff;
  }

  .result-flash.wrong-flash {
    background: var(--wrong);
    color: #fff;
  }

  @keyframes flashIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes flashOut {
    to { opacity: 0; transform: translateX(20px); }
  }

  /* Progress bar */
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 100px;
    margin-bottom: 24px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width 0.5s ease;
    width: 0%;
  }

  @media (max-width: 500px) {
    .options { grid-template-columns: 1fr; }
    .question-text { font-size: 1.05rem; }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">GK<span>∞</span></div>
<!-- score section -->
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="score">0</div>
        <div class="stat-label">Score</div>
      </div>
      <div class="stat streak">
        <div class="stat-value" id="streak">0</div>
        <div class="stat-label">Streak</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="total">0</div>
        <div class="stat-label">Total</div>
      </div>
    </div>
    <!-- end -->
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div id="quizArea">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Loading question...</div>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  // History
  { q: "Who was the first President of the United States?", opts: ["John Adams", "George Washington", "Thomas Jefferson", "Benjamin Franklin"], ans: 1, cat: "History", exp: "George Washington served as the first U.S. President from 1789 to 1797." },
  { q: "In which year did World War II end?", opts: ["1943", "1944", "1945", "1946"], ans: 2, cat: "History", exp: "World War II ended in 1945 — in Europe on May 8 (V-E Day) and in the Pacific on September 2 (V-J Day)." },
  { q: "The Magna Carta was signed in which year?", opts: ["1215", "1315", "1415", "1515"], ans: 0, cat: "History", exp: "The Magna Carta was signed by King John of England on June 15, 1215." },
  { q: "Which ancient wonder was located in Alexandria, Egypt?", opts: ["Colossus of Rhodes", "Hanging Gardens", "Lighthouse of Alexandria", "Temple of Artemis"], ans: 2, cat: "History", exp: "The Lighthouse of Alexandria (Pharos) was one of the tallest structures of the ancient world, guiding sailors into harbor." },
  { q: "Who invented the telephone?", opts: ["Thomas Edison", "Nikola Tesla", "Alexander Graham Bell", "Guglielmo Marconi"], ans: 2, cat: "History", exp: "Alexander Graham Bell is credited with inventing and patenting the first practical telephone in 1876." },
  { q: "The French Revolution began in which year?", opts: ["1775", "1789", "1799", "1804"], ans: 1, cat: "History", exp: "The French Revolution began in 1789, triggered by financial crisis and social inequality." },
  { q: "Which empire was ruled by Genghis Khan?", opts: ["Ottoman Empire", "Roman Empire", "Mongol Empire", "Persian Empire"], ans: 2, cat: "History", exp: "Genghis Khan founded and ruled the Mongol Empire, which became the largest contiguous empire in history." },
  { q: "India gained independence from Britain in which year?", opts: ["1945", "1946", "1947", "1948"], ans: 2, cat: "History", exp: "India gained independence on August 15, 1947, after nearly 200 years of British rule." },

  // Science
  { q: "What is the chemical symbol for Gold?", opts: ["Go", "Gd", "Au", "Ag"], ans: 2, cat: "Science", exp: "Gold's symbol 'Au' comes from the Latin word 'Aurum'." },
  { q: "How many bones are in the adult human body?", opts: ["196", "206", "216", "226"], ans: 1, cat: "Science", exp: "An adult human body has 206 bones. Babies are born with about 270–300 bones, many of which fuse over time." },
  { q: "What planet is known as the Red Planet?", opts: ["Venus", "Jupiter", "Saturn", "Mars"], ans: 3, cat: "Science", exp: "Mars is called the Red Planet because of iron oxide (rust) on its surface which gives it a reddish appearance." },
  { q: "What is the speed of light in vacuum?", opts: ["3×10⁶ m/s", "3×10⁸ m/s", "3×10¹⁰ m/s", "3×10⁵ m/s"], ans: 1, cat: "Science", exp: "The speed of light in a vacuum is approximately 299,792,458 m/s ≈ 3×10⁸ m/s." },
  { q: "The powerhouse of the cell is the:", opts: ["Nucleus", "Ribosome", "Mitochondria", "Golgi body"], ans: 2, cat: "Science", exp: "Mitochondria are called the 'powerhouse of the cell' because they produce ATP through cellular respiration." },
  { q: "Which element has the atomic number 1?", opts: ["Helium", "Oxygen", "Carbon", "Hydrogen"], ans: 3, cat: "Science", exp: "Hydrogen (H) is the lightest and most abundant element in the universe with atomic number 1." },
  { q: "What is the most abundant gas in Earth's atmosphere?", opts: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Argon"], ans: 2, cat: "Science", exp: "Nitrogen (N₂) makes up about 78% of Earth's atmosphere, followed by oxygen at 21%." },
  { q: "DNA stands for:", opts: ["Deoxyribose Nucleic Acid", "Deoxyribonucleic Acid", "Diribonucleic Acid", "Dioxyribonucleic Acid"], ans: 1, cat: "Science", exp: "DNA stands for Deoxyribonucleic Acid — the molecule that carries genetic information." },

  // Geography
  { q: "Which is the longest river in the world?", opts: ["Amazon", "Nile", "Yangtze", "Mississippi"], ans: 1, cat: "Geography", exp: "The Nile River in Africa is generally considered the world's longest river at about 6,650 km." },
  { q: "Which country has the largest land area?", opts: ["Canada", "USA", "China", "Russia"], ans: 3, cat: "Geography", exp: "Russia is the world's largest country by land area, covering over 17 million sq km." },
  { q: "Mount Everest is located in which mountain range?", opts: ["Alps", "Andes", "Himalayas", "Rockies"], ans: 2, cat: "Geography", exp: "Mount Everest, the world's highest peak, is part of the Himalayan mountain range on the Nepal-Tibet border." },
  { q: "What is the capital of Australia?", opts: ["Sydney", "Melbourne", "Brisbane", "Canberra"], ans: 3, cat: "Geography", exp: "Canberra is the capital of Australia — a planned city built as a compromise between rivals Sydney and Melbourne." },
  { q: "Which ocean is the largest?", opts: ["Atlantic", "Indian", "Pacific", "Arctic"], ans: 2, cat: "Geography", exp: "The Pacific Ocean is the largest, covering about 165 million sq km — more than all land on Earth combined." },
  { q: "The Sahara Desert is located in which continent?", opts: ["Asia", "Australia", "South America", "Africa"], ans: 3, cat: "Geography", exp: "The Sahara Desert covers much of North Africa, spanning about 9.2 million sq km." },
  { q: "Which country has the most natural lakes?", opts: ["USA", "Russia", "Canada", "Brazil"], ans: 2, cat: "Geography", exp: "Canada has the most lakes in the world, with over 2 million lakes covering about 9% of its land area." },

  // General Knowledge
  { q: "Which is the smallest planet in our solar system?", opts: ["Mars", "Venus", "Mercury", "Pluto"], ans: 2, cat: "Space", exp: "Mercury is the smallest planet in our solar system (Pluto is now classified as a dwarf planet)." },
  { q: "How many sides does a hexagon have?", opts: ["5", "6", "7", "8"], ans: 1, cat: "Math", exp: "A hexagon has 6 sides. 'Hex' comes from Greek meaning six." },
  { q: "Who wrote 'Romeo and Juliet'?", opts: ["Charles Dickens", "William Shakespeare", "Jane Austen", "Mark Twain"], ans: 1, cat: "Literature", exp: "Romeo and Juliet was written by William Shakespeare around 1594–1596." },
  { q: "Which instrument has 88 keys?", opts: ["Guitar", "Organ", "Piano", "Harpsichord"], ans: 2, cat: "Arts", exp: "A standard piano has 88 keys — 52 white and 36 black." },
  { q: "The Olympic Games originated in which country?", opts: ["Italy", "France", "Greece", "Egypt"], ans: 2, cat: "Sports", exp: "The ancient Olympic Games originated in Olympia, Greece in 776 BC." },
  { q: "What is the largest mammal on Earth?", opts: ["African Elephant", "Blue Whale", "Sperm Whale", "Giraffe"], ans: 1, cat: "Science", exp: "The Blue Whale is the largest animal ever known to have lived, reaching up to 30 meters and 180 tons." },
  { q: "How many colors are in a rainbow?", opts: ["5", "6", "7", "8"], ans: 2, cat: "Science", exp: "A rainbow has 7 colors: Red, Orange, Yellow, Green, Blue, Indigo, and Violet (ROYGBIV)." },
  { q: "Which gas do plants absorb during photosynthesis?", opts: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], ans: 2, cat: "Science", exp: "Plants absorb CO₂ from the air and, using sunlight and water, convert it into glucose and oxygen." },
  { q: "What is the hardest natural substance on Earth?", opts: ["Iron", "Quartz", "Diamond", "Sapphire"], ans: 2, cat: "Science", exp: "Diamond is the hardest natural substance on Earth, rating 10 on the Mohs hardness scale." },
  { q: "Who painted the Mona Lisa?", opts: ["Michelangelo", "Raphael", "Leonardo da Vinci", "Botticelli"], ans: 2, cat: "Arts", exp: "The Mona Lisa was painted by Leonardo da Vinci, created between 1503 and 1519." },
  { q: "What is the currency of Japan?", opts: ["Yuan", "Won", "Yen", "Baht"], ans: 2, cat: "Economics", exp: "The Japanese Yen (¥) is the official currency of Japan." },
  { q: "The Great Wall of China was primarily built to protect against:", opts: ["Pirates", "Sea invasions", "Mongol invasions", "Persian armies"], ans: 2, cat: "History", exp: "The Great Wall was primarily built to protect against raids from Mongol and other nomadic tribes." },
  { q: "Which organ produces insulin in the human body?", opts: ["Liver", "Kidney", "Pancreas", "Stomach"], ans: 2, cat: "Science", exp: "The pancreas produces insulin, a hormone that regulates blood sugar levels." },
  { q: "What is the largest continent by area?", opts: ["Africa", "North America", "Asia", "Antarctica"], ans: 2, cat: "Geography", exp: "Asia is the world's largest continent, covering about 44.6 million sq km — 30% of Earth's land area." },
  { q: "How many planets are in our solar system?", opts: ["7", "8", "9", "10"], ans: 1, cat: "Space", exp: "Our solar system has 8 planets. Pluto was reclassified as a dwarf planet by the IAU in 2006." },
  { q: "What is the chemical formula of water?", opts: ["HO", "H₂O", "H₂O₂", "HO₂"], ans: 1, cat: "Science", exp: "Water is H₂O — two hydrogen atoms bonded to one oxygen atom." },
  { q: "Who is known as the Father of the Nation in India?", opts: ["Nehru", "Ambedkar", "Subhash Chandra Bose", "Mahatma Gandhi"], ans: 3, cat: "History", exp: "Mahatma Gandhi is known as the Father of the Nation in India for his role in leading India to independence." },
  { q: "The currency of the United Kingdom is:", opts: ["Euro", "Dollar", "Pound Sterling", "Franc"], ans: 2, cat: "Economics", exp: "The UK uses the Pound Sterling (£). The UK did not adopt the Euro when other European nations did." },
  { q: "Which planet has the most moons?", opts: ["Jupiter", "Saturn", "Uranus", "Neptune"], ans: 1, cat: "Space", exp: "Saturn holds the record with 146 confirmed moons as of recent discoveries, surpassing Jupiter." },
  { q: "What is the tallest mountain in the world?", opts: ["K2", "Kangchenjunga", "Mount Everest", "Lhotse"], ans: 2, cat: "Geography", exp: "Mount Everest at 8,848.86 m is the tallest mountain above sea level." },
  { q: "In which year did the Berlin Wall fall?", opts: ["1987", "1988", "1989", "1990"], ans: 2, cat: "History", exp: "The Berlin Wall fell on November 9, 1989, marking a major turning point in the Cold War." },
  { q: "What is the most spoken language in the world by native speakers?", opts: ["English", "Spanish", "Mandarin Chinese", "Hindi"], ans: 2, cat: "Language", exp: "Mandarin Chinese has the most native speakers — over 900 million people." },
];

let questionPool = [];
let usedIndices = new Set();
let score = 0;
let streak = 0;
let total = 0;
let currentQuestion = null;
let answered = false;

function getNextQuestion() {
  if (usedIndices.size === QUESTIONS.length) {
    usedIndices.clear();
  }
  let idx;
  do {
    idx = Math.floor(Math.random() * QUESTIONS.length);
  } while (usedIndices.has(idx));
  usedIndices.add(idx);
  return { ...QUESTIONS[idx], index: idx };
}

function updateStats() {
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streak;
  document.getElementById('total').textContent = total;
  const accuracy = total > 0 ? Math.round((score / total) * 100) : 0;
  document.getElementById('progressFill').style.width = accuracy + '%';
}

function showFlash(correct) {
  const existing = document.querySelector('.result-flash');
  if (existing) existing.remove();
  const flash = document.createElement('div');
  flash.className = `result-flash ${correct ? 'correct-flash' : 'wrong-flash'}`;
  flash.textContent = correct ? `✓ Correct! +1` : `✗ Wrong!`;
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 2000);
}

function renderQuestion() {
  answered = false;
  currentQuestion = getNextQuestion();
  const q = currentQuestion;
  const letters = ['A', 'B', 'C', 'D'];

  const html = `
    <div class="category-badge">📚 ${q.cat}</div>
    <div class="question-card">
      <div class="q-number">Q.${total + 1}</div>
      <div class="question-text">${q.q}</div>
    </div>
    <div class="options">
      ${q.opts.map((opt, i) => `
        <button class="option" onclick="handleAnswer(${i})" data-index="${i}">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>
      `).join('')}
    </div>
    <div class="explanation" id="explanation">
      <strong>💡 Explanation:</strong> ${q.exp}
    </div>
    <button class="next-btn" id="nextBtn" onclick="renderQuestion()">NEXT QUESTION →</button>
  `;

  document.getElementById('quizArea').innerHTML = html;
}

function handleAnswer(selected) {
  if (answered) return;
  answered = true;
  total++;

  const q = currentQuestion;
  const buttons = document.querySelectorAll('.option');
  const isCorrect = selected === q.ans;

  buttons.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.ans) btn.classList.add('correct');
    else if (i === selected) btn.classList.add('wrong');
  });

  if (isCorrect) {
    score++;
    streak++;
  } else {
    streak = 0;
  }

  showFlash(isCorrect);
  updateStats();

  document.getElementById('explanation').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
}

// Init
updateStats();
renderQuestion();
</script>
</body>
</html>
